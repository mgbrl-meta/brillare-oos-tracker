name: Brillare OOS Tracker

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brillare-oos-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main before running
        run: |
          git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run daily scraper
        working-directory: scraper
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: python main.py

      - name: Build monthly report
        working-directory: scraper
        run: python report.py

      - name: Sync data to dashboard
        run: |
          mkdir -p dashboard/public/data
          cp scraper/data/latest.json dashboard/public/data/ 2>/dev/null || true
          cp scraper/data/history.jsonl dashboard/public/data/ 2>/dev/null || true
          cp scraper/data/report_*.json dashboard/public/data/ 2>/dev/null || true
          cp scraper/data/history_compact.json dashboard/public/data/ 2>/dev/null || true

      - name: Commit history and data
        run: |
          git config user.name "mgbrl-meta"
          git config user.email "mgbrl-meta@users.noreply.github.com"

          git pull --rebase --autostash origin main

          git add scraper/data dashboard/public/data
          git diff --staged --quiet || git commit -m "Tracker run $(date -u +%Y-%m-%d)"

          git push origin main
